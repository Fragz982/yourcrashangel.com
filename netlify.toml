[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Security headers applied to every response. CSP intentionally allows
# 'unsafe-inline' for scripts/styles because the static export ships inline
# hydration scripts and framer-motion injects inline styles; this still blocks
# external script/object injection. img-src allows Unsplash (placeholder photos).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self'; connect-src 'self' https://vpic.nhtsa.dot.gov; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
